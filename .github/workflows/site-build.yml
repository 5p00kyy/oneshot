name: Site build and deploy

# Pull requests build and verify the OneShot Lab without deploying it.
# Merges to main additionally publish the same verified bytes to GitHub Pages.

on:
  # Every main commit produces a verified Pages deployment. The release
  # workflow requires a successful run for the exact commit it publishes.
  push:
    branches: [main]
  pull_request:
    paths:
      - "site/**"
      - "library/**"
      - "scripts/validate_library.py"
      - "tests/test_library.py"
      - ".github/workflows/site-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install locked site dependencies
        working-directory: site
        run: npm ci --no-fund --no-audit

      - name: Validate challenge library
        run: python3 scripts/validate_library.py

      - name: Build site
        working-directory: site
        run: npm run build

      - name: Verify built output
        working-directory: site
        run: npm run verify:dist

      - name: Upload site inspection artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oneshot-site
          path: site/dist
          if-no-files-found: error
          retention-days: 7

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
