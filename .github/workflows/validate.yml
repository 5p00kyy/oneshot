name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate repository
        run: python3 scripts/validate_repo.py

      - name: Run tests
        run: python3 -m unittest discover -s tests -p "test_*.py" -v

      - name: Build release package
        run: python3 scripts/package_release.py --clean

      - name: Validate with GitHub CLI skill publisher when available
        shell: bash
        run: |
          if gh skill publish --help >/dev/null 2>&1; then
            gh skill publish . --dry-run
          else
            echo "gh skill is not available on this runner; repository validation already passed."
          fi

      - name: Upload release package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oneshot-skill
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 7
